<!DOCTYPE html>
<html>
<head>
    <title>Student </title>
</head>

<body>

<h1>Student Management System</h1>

<h2>Student Details </h2>
<link rel="stylesheet" href="index.css">

<form id="studentForm">

    <label>Name:</label>
    <input type="text" id="name" required>
    <br><br>

    <label>Roll Number:</label>
    <input type="text" id="rollNumber" required>
    <br><br>

    <label>Class:</label>
    <input type="text" id="className" required>
    <br><br>

    <label>Tamil:</label>
    <input type="number" id="tamil" required>
    <br><br>

    <label>English:</label>
    <input type="number" id="english" required>
    <br><br>

    <label>Social:</label>
    <input type="number" id="social" required>
    <br><br>

    <label>Maths:</label>
    <input type="number" id="maths" required>
    <br><br>

    <label>Science:</label>
    <input type="number" id="science" required>
    <br><br>

    <button type="submit">Add Student</button>

</form>

<br>

<a href="student.html">View Student List</a>

<script src="index.js"></script>

</body>
</html>
